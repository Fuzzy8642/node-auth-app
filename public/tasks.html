<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Задачи</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border, #e2e8f0);
      margin-bottom: 20px;
      align-items: center;
    }
    .filters-bar input,
    .filters-bar select {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: var(--text, #0f172a);
    }
    .filters-bar input[type="search"] {
      flex: 1 1 220px;
      min-width: 200px;
    }
    .filters-bar select {
      flex: 0 1 170px;
    }
    .tasks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar">
      <h2 style="font-size:1.1rem; margin-bottom:1.5rem; color:#fff;">TaskFlow</h2>
      <nav class="side-nav">
        <a href="/dashboard.html">📊 Дашборд</a>
        <a href="/tasks.html" class="active">✅ Задачи</a>
        <a href="/projects.html">📁 Проекты</a>
        <a href="/admin.html" id="adminLink" style="display:none;">⚙️ Админ</a>
      </nav>
      <div class="side-user">
        <div id="userInfo">...</div>
        <button class="btn btn-ghost" id="logoutBtn"
                style="margin-top:.75rem; width:100%; color:#cbd5e1; border-color:#334155;">
          Выйти
        </button>
      </div>
    </aside>

    <main class="app-main">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
        <h1 style="margin:0;">Задачи</h1>
      </div>

      <form id="filterForm" class="filters-bar">
        <input type="search" id="searchInput" name="q" placeholder="🔍 Поиск по названию...">

        <select id="statusFilter" name="status">
          <option value="">Все статусы</option>
          <option value="todo">To Do</option>
          <option value="in_progress">In Progress</option>
          <option value="review">Review</option>
          <option value="done">Done</option>
        </select>

        <select id="priorityFilter" name="priority">
          <option value="">Все приоритеты</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>

        <select id="assigneeFilter" name="assignee_id">
          <option value="">Все исполнители</option>
        </select>

        <button type="submit" class="btn btn-primary">Найти</button>
        <button type="button" id="resetFiltersBtn" class="btn btn-ghost">Сбросить</button>
      </form>

      <div id="tasksGrid" class="tasks-grid">
        <p style="color:var(--muted);">Загрузка задач...</p>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/tasks.js"></script>
</body>
</html>
